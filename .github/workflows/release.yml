name: Release

# Neuer Tag vX.Y.Z (git push --tags) → erst prüfen, dann GitHub-Release mit dem Text aus CHANGELOG.md.
# HACS verlangt, dass das Release NACH erfolgreicher Prüfung entsteht – deshalb hängt "release" an beiden Prüfungen.
on:
  push:
    tags:
      - "v*"
  # Fehlendes/als Entwurf hängendes Release nachholen: Actions → Release → Run workflow → Tag eingeben
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, z. B. v2.6.2"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  release:
    name: GitHub-Release
    needs: [hassfest, hacs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Version prüfen (Tag = manifest.json)
        run: |
          TAG="${TAG#v}"
          MANIFEST=$(python3 -c "import json;print(json.load(open('custom_components/smartlists/manifest.json'))['version'])")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag v$TAG passt nicht zur Version $MANIFEST in manifest.json"
            exit 1
          fi

      - name: Text aus CHANGELOG.md
        run: |
          VERSION="${TAG#v}"
          # Abschnitt "## [VERSION]" bis zum nächsten "## [" (ohne die Überschrift)
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes_body.md
          if [ ! -s notes_body.md ]; then
            echo "::error::Kein Abschnitt '## [$VERSION]' in CHANGELOG.md"
            exit 1
          fi
          {
            echo "## What's new"
            # "### Added" usw. übernehmen, führende Leerzeilen weg
            sed '/./,$!d' notes_body.md
            echo
            echo "**Note:** restart Home Assistant after updating and reload the page (Ctrl+F5)."
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)"
          } > notes.md
          cat notes.md

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # „latest“ nur für die höchste Version (beim Nachholen älterer Releases nicht umstellen)
          HIGHEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          LATEST=$([ "$TAG" = "$HIGHEST" ] && echo true || echo false)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # nach dem Neu-Pushen eines Tags macht GitHub das Release zum Entwurf → wieder veröffentlichen
            gh release edit "$TAG" --title "${TAG#v}" --notes-file notes.md --draft=false --latest=$LATEST
          else
            gh release create "$TAG" --title "${TAG#v}" --notes-file notes.md --verify-tag --latest=$LATEST
          fi
