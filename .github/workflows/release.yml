name: Release

# Releases entstehen automatisch:
#   - Push auf main, bei dem sich die Version in manifest.json ändert → Tag vX.Y.Z + Release (kein Tag-Push nötig)
#   - Push eines Tags vX.Y.Z (wie bisher)
#   - von Hand: Actions → Release → Run workflow → Tag (z. B. um ein Release nachzuholen)
# Immer erst Hassfest + HACS, dann das Release mit dem Text aus CHANGELOG.md (HACS verlangt diese Reihenfolge).
# Ein vorhandenes Release wird aktualisiert und – falls GitHub es zum Entwurf gemacht hat – wieder veröffentlicht.
on:
  push:
    branches: [main]
    paths: ["custom_components/smartlists/manifest.json"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, z. B. v2.8.0 (leer = Version aus manifest.json)"
        required: false

permissions:
  contents: write

jobs:
  version:
    name: Version bestimmen
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          MANIFEST=$(python3 -c "import json;print(json.load(open('custom_components/smartlists/manifest.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"; REF="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"; REF="$INPUT_TAG"
          else
            TAG="v$MANIFEST"; REF="$GITHUB_SHA"
            # Push auf main: nur wenn es für diese Version noch kein veröffentlichtes Release gibt
            if gh release view "$TAG" --json isDraft -q '.isDraft' 2>/dev/null | grep -q false; then
              echo "Release $TAG gibt es schon – nichts zu tun."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
            # existiert der Tag schon (z. B. von Hand gepusht), dessen Stand verwenden
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then REF="$TAG"; fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Release für $TAG aus $REF"

  hassfest:
    name: Hassfest
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  release:
    name: GitHub-Release
    needs: [version, hassfest, hacs]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.version.outputs.tag }}
      REF: ${{ needs.version.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.ref }}
          fetch-depth: 0

      - name: Version prüfen (Tag = manifest.json)
        run: |
          MANIFEST=$(python3 -c "import json;print(json.load(open('custom_components/smartlists/manifest.json'))['version'])")
          if [ "${TAG#v}" != "$MANIFEST" ]; then
            echo "::error::Tag $TAG passt nicht zur Version $MANIFEST in manifest.json"
            exit 1
          fi

      - name: Text aus CHANGELOG.md
        run: |
          VERSION="${TAG#v}"
          # Abschnitt "## [VERSION]" bis zum nächsten "## [" (ohne die Überschrift)
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes_body.md
          if [ ! -s notes_body.md ]; then
            echo "::error::Kein Abschnitt '## [$VERSION]' in CHANGELOG.md"
            exit 1
          fi
          {
            echo "## What's new"
            sed '/./,$!d' notes_body.md
            echo
            echo "**Note:** restart Home Assistant after updating and reload the page (Ctrl+F5)."
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)"
          } > notes.md
          cat notes.md

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # „latest“ nur für die höchste Version (beim Nachholen älterer Releases nicht umstellen)
          HIGHEST=$( (git tag -l 'v*'; echo "$TAG") | sort -uV | tail -1)
          LATEST=$([ "$TAG" = "$HIGHEST" ] && echo true || echo false)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # nach dem Neu-Pushen eines Tags macht GitHub das Release zum Entwurf → wieder veröffentlichen
            gh release edit "$TAG" --title "${TAG#v}" --notes-file notes.md --draft=false --latest=$LATEST
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            gh release create "$TAG" --title "${TAG#v}" --notes-file notes.md --verify-tag --latest=$LATEST
          else
            # Push auf main ohne Tag: Tag auf genau diesen Commit setzen
            gh release create "$TAG" --title "${TAG#v}" --notes-file notes.md --target "$REF" --latest=$LATEST
          fi
