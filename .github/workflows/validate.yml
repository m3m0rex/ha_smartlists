name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # wöchentlich: fällt auf, wenn sich Prüfregeln ändern

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-24.04
    steps:
      - uses: hacs/action@main
        with:
          category: integration
