name: Wiki

# docs/wiki → GitHub-Wiki, bei jedem Push auf main, der dort etwas ändert.
# Einmalig vorher: Wiki in den Repo-Einstellungen aktivieren und eine erste Seite anlegen
# (sonst existiert das Wiki-Repository noch nicht).
on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ins Wiki übertragen
        env:
          TOKEN: ${{ github.token }}
        run: |
          if ! git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::Wiki noch nicht angelegt. Einmalig: Settings → Features → Wikis aktivieren, dann im Reiter Wiki 'Create the first page' → 'Save page'. Danach diese Action erneut starten (Re-run)."
            exit 1
          fi
          # Wiki-Inhalt vollständig durch docs/wiki ersetzen (Seiten, die dort gelöscht wurden, verschwinden)
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r docs/wiki/. wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki ist aktuell."
          else
            git commit -m "Wiki aus docs/wiki (${GITHUB_SHA::7})"
            git push
          fi
