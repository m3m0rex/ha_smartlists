get_items:
  fields:
    entity_id:
      selector:
        entity:
          domain: todo
          multiple: true
    store:
      example: "REWE"
      selector:
        text:
    person:
      example: "Anna"
      selector:
        text:
    tag:
      example: "bio"
      selector:
        text:
    category:
      example: "drogerie"
      selector:
        select:
          options:
            - obst_gemuese
            - fleisch
            - kuehlung
            - grundnahrung
            - backwaren
            - getraenke
            - suessigkeiten
            - haushalt
            - drogerie
            - tiefkuehl
            - tierbedarf
            - sonstiges
    include_completed:
      default: false
      selector:
        boolean:
add_due_items:

add_template:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    template:
      required: true
      example: "Pfannkuchen"
      selector:
        text:
    servings:
      example: 4
      selector:
        number:
          min: 1
          max: 100
